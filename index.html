<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon.svg"
    />
    <script defer src="./scripts.js"></script>
    <title>Kanban Task Management</title>
  </head>

  <body>
    <!-- Navigation Sidebar -->
    <nav class="side-bar" id="side-bar-div">
      <div id="side-logo-div">
        <img id="app-logo" src="assets/logo-light.svg" alt="logo" />
      </div>

      <div class="boards-nav-links-div" id="boards-nav-links-div">
        <h4 id="headline-sidepanel">ALL BOARDS (1)</h4>
        <button class="board-btn" id="launchCareerBtn">Launch Career</button>
      </div>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <div class="theme-toggle">
          <img src="assets/icon-light-theme.svg" alt="Light Mode" id="light-icon" />
          <label class="switch">
            <input type="checkbox" id="theme-switch">
            <span class="slider"></span>
          </label>
          <img src="assets/icon-dark-theme.svg" alt="Dark Mode" id="dark-icon" />
        </div>

        <button class="hide-sidebar-btn" id="hide-sidebar-btn">
          <img src="assets/icon-hide-sidebar.svg" alt="Hide Sidebar" />
          Hide Sidebar
        </button>
      </div>
    </nav>

    <!-- Floating Show Sidebar Button -->
    <button class="show-sidebar-btn" id="show-sidebar-btn">
      <img src="assets/icon-show-sidebar.svg" alt="Show Sidebar" />
    </button>

    <!-- Main Layout -->
    <div id="layout">
      <!-- Header -->
      <header>
        <div class="header-name-div">
          <img
            src="assets/favicon.svg"
            alt="logo-mobile"
            class="logo-mobile"
            id="mobile-theme-toggle"
          />
          <h2 class="header-board-name" id="header-board-name">
            Launch Career
          </h2>
        </div>
        <button id="add-task-btn"><span class="btn-text">Add Task</span></button>
      </header>

      <div class="container">
        <main class="card-column-main">
          <!-- TODO Column -->
          <div class="column-div" data-status="todo">
            <div id="todo-head-div" class="column-head-div">
              <span class="dot" id="todo-dot"></span>
              <h4 id="toDoText" class="columnHeader">TODO (0)</h4>
            </div>
            <div class="tasks-container" id="todo-tasks"></div>
          </div>

          <!-- DOING Column -->
          <div class="column-div" data-status="doing">
            <div id="doing-head-div" class="column-head-div">
              <span class="dot" id="doing-dot"></span>
              <h4 id="doingText" class="columnHeader">DOING (0)</h4>
            </div>
            <div class="tasks-container" id="doing-tasks"></div>
          </div>

          <!-- DONE Column -->
          <div class="column-div" data-status="done">
            <div id="done-head-div" class="column-head-div">
              <span class="dot" id="done-dot"></span>
              <h4 id="doneText" class="columnHeader">DONE (0)</h4>
            </div>
            <div class="tasks-container" id="done-tasks"></div>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal -->
    <div id="task-modal" class="modal hidden">
      <div class="modal-content">
        <span id="close-modal" class="close-button">&times;</span>
        <h2 id="modal-header">Task</h2>

        <label for="modal-title">Title</label>
        <input type="text" id="modal-title" placeholder="Enter task title" />

        <label for="modal-description">Description</label>
        <textarea id="modal-description" placeholder="Enter task description"></textarea>

        <label for="modal-status">Status</label>
        <select id="modal-status">
          <option value="todo">To Do</option>
          <option value="doing">In Progress</option>
          <option value="done">Done</option>
        </select>

        <div class="modal-footer">
          <button id="save-task">Save Changes</button>
          <button id="delete-task" class="hidden">Delete Task</button>
        </div>
      </div>
    </div>
  </body>
</html>
